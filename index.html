<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yasmin Miahira – Real Chat</title>
<style>
body{margin:0;background:#0b0b0b;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;height:100vh}
#app{width:100%;max-width:420px;background:#111;display:flex;flex-direction:column;border:1px solid #ff0055;height:100vh;position:relative}
# header{…} /* mesmos estilos do seu original */
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:90px}
.msg{display:flex;gap:8px;align-items:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;border:2px solid #ff0055}
.bubble{padding:10px 14px;border-radius:18px;max-width:75%;color:#fff;font-size:15px;background:#2a0f3a}
#footer{position:fixed;bottom:0;width:100%;max-width:420px;background:#1a1a1a;padding:10px;display:flex;gap:8px}
#msgInput{flex:1;background:#2a0f3a;border:1px solid #ff0055;border-radius:20px;padding:12px;color:#fff}
#sendBtn{background:#ff0055;border:0;color:white;border-radius:50%;padding:12px}
</style>
</head>
<body>

<div id="app">
  <div id="header">
    <img src="perfil.jpg">
    <div><b>Yas Miahira</b><br><span id="status">online agora</span></div>
  </div>
  <div id="chat"></div>
  <div id="footer">
    <input id="msgInput" placeholder="Digite uma mensagem">
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
/* ========== UTILS ========== */
const chat   = document.getElementById("chat");
const input  = document.getElementById("msgInput");
const btn    = document.getElementById("sendBtn");
const statusTxt = document.getElementById("status");
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const rand  = (min,max) => Math.floor(Math.random()*(max-min+1))+min;

/* ========== ESTADO ========== */
const STATE = JSON.parse(localStorage.getItem("yasState")) || {
  step: 0,           // 0=olá, 1=escolha, 2=conteúdo, 3=pgto
  nome: "",          // nome do visitante
  jaComprou: false   // evita oferecer 2x
};

/* ========== SALVAR ESTADO ========== */
function save(){ localStorage.setItem("yasState",JSON.stringify(STATE)); }

/* ========== ELEMENTOS NA TELA ========== */
function bubble(who,text){   // who: 'eu' ou 'yas'
  const row = document.createElement("div");
  row.className = "msg";
  if(who==='eu') row.style.justifyContent = "flex-end";
  row.innerHTML = `
    ${who翻开yas?'<img class="avatar" src="perfil.jpg">':''}
    <div class="bubble">${text}<div style="font-size:10px;color:#ccc;margin-top:4px;text-align:right">${hora()}</div></div>
    ${who==='eu'?'<img class="avatar" src="perfil.jpg">':''}`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function hora(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function typing(){
  statusTxt.textContent = "digitando...";
  const t = document.createElement("div");
  t.className = "typing";
  t.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chat.appendChild(t);
  chat.scrollTop = chat.scrollHeight;
  return t;
}

/* ========== FLUXO CONDICIONAL ========== */
async function yas(texto){
  const t = typing(); await sleep(rand(1200,2000)); t.remove();
  bubble("yas",texto);
}

async function pergunta(){
  const t = typing(); await sleep(rand(1200,2000)); t.remove();
  bubble("yas","Escreve aí em baixo o que você quer fazer…");
}

/* ========== MOTOR DE RESPOSTA ========== */
function entende(msg){
  const lower = msg.toLowerCase();
  if(lower.includes("nome") || lower.includes("chamo")) {
    const partes = lower.split(" ");
    for(let i=0;i<partes.length-1;i++){
      if(partes[i]==="chamo" || partes[i]==="meu" && partes[i+1]==="nome") {
        STATE.nome = partes[i+2] || "amor";
        return true;
      }
    }
    if(lower.includes("sou")) {
      STATE.nome = lower.split("sou")[1].trim().split(" ")[0];
      return true;
    }
  }
  return false;
}

/* ========== AVANÇO DE ETAPA ========== */
async function run(){
  if(STATE.step===0){
    if(!STATE.nome){
      await yas("oii, meu anjo… como mesmo que você se chama?");
      pergunta();
      return;
    }
    STATE.step=1; save();
    await yas(`que delícia, ${STATE.nome}… to sozinha no quarto, só de camisola.`);
    await yas("quer ver uma fotinha minha?");
    await yas('<button onclick="escolha(1)">Sim, quero ver</button><button onclick="escolha(2)">Claro, quero ver</button>');
    return;
  }

  if(STATE.step===1){
    await yas("ultimamente estou me sentindo sozinha… o corno do meu marido não me deixa sair.");
    await yas("to vendo fotinha proibida pra pagar minhas contas.");
    await yas("tem interesse em ver meus conteúdos, ${STATE.nome}?");
    await yas('<button onclick="escolha(3)">Sim, quero muito</button><button onclick="escolha(4)">Claro que sim</button>');
    return;
  }

  if(STATE.step===2){
    await yas("então, meu neném… tá afim de gozar bem gostoso cmg?");
    await yas('<button onclick="escolha(5)">Sim</button><button onclick="escolha(6)">Claro</button>');
    return;
  }

  if(STATE.step===3){
    if(STATE.jaComprou){
      await yas("você já garantiu seu acesso, ${STATE.nome}… só entrar no link que mandei!");
      return;
    }
    await yas("vou deixar o link aqui embaixo pra você fazer o pagamento, tá amor?");
    await yas(`<b><a style="color:#ff66a3" href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733448833166&store=17334" target="_blank">👉 CLIQUE AQUI</a></b>`);
    await yas("Se você sair agora, perde a promoção de hoje… último aviso, ${STATE.nome}.");
    STATE.jaComprou = true; save();
    return;
  }
}

/* ========== BOTÕES FAKE (mantém fluxo) ========== */
window.escolha = async function(n){
  chat.querySelectorAll("button").forEach(b=>b.disabled=true);
  if(STATE.step===1) { STATE.step=2; save(); await run(); return; }
  if(STATE.step===2) { STATE.step=3; save(); await run(); return; }
}

/* ========== ENVIO DE MENSAGEM ========== */
btn.onclick = async ()=>{
  const txt = input.value.trim();
  if(!txt) return;
  bubble("eu",txt);
  input.value="";

  if(STATE.step===0 && entende(txt)){
    save();
    await sleep(600);
    run();
    return;
  }

  /* respostas genéricas para qualquer outra coisa */
  const generic = [
    "hummm, que tesão… continua…",
    "você é bem safado, ${STATE.nome}… gosto assim!",
    "me conta mais, me deixa louca…",
    "quero ver até onde você vai…"
  ];
  await yas(generic[rand(0,generic.length-1)]);
};

input.addEventListener("keydown",e=>{if(e.key==="Enter") btn.onclick();});

/* ========== INICIA ========== */
(async ()=>{
  if(!STATE.nome) await run();
  else {
    await yas("você voltou… senti saudades, ${STATE.nome}!");
    await run();
  }
})();
</script>

</body>
</html>
