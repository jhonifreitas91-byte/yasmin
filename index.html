<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat Realista</title>

<style>
body{
margin:0;
background:#0b0b0b;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
height:100vh
}

#app{
width:100%;
max-width:420px;
background:#111;
display:flex;
flex-direction:column;
border:1px solid #ff0055
}

#header{
background:#1a1a1a;
padding:10px;
display:flex;
gap:10px;
align-items:center;
color:#fff
}

#header img{
width:42px;
height:42px;
border-radius:50%;
border:2px solid #ff0055
}

#status{
font-size:12px;
color:#ff66a3
}

#chat{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth
}

.msg{
display:flex;
gap:8px;
align-items:flex-end
}

.avatar{
width:30px;
height:30px;
border-radius:50%;
border:2px solid #ff0055
}

.bubble{
padding:10px 14px;
border-radius:18px;
max-width:75%;
color:#fff;
font-size:15px
}

.them{background:#2a0f3a}
.me{background:#ff0055;margin-left:auto}

.typing,.mic{
margin-left:38px;
color:#ff66a3
}

.audio audio{
width:200px
}

.chat-img{
max-width:220px;
border-radius:12px;
cursor:pointer
}

#footer{
background:#1a1a1a;
padding:10px;
display:flex;
gap:8px
}

#msgInput{
flex:1;
background:#2a0f3a;
border:1px solid #ff0055;
border-radius:20px;
padding:12px;
color:#fff
}

#sendBtn{
background:#ff0055;
border:0;
color:white;
border-radius:50%;
padding:12px;
cursor:pointer
}

button{
background:#ff0055;
border:0;
color:white;
padding:8px 14px;
border-radius:16px;
margin:4px;
cursor:pointer
}

#fullscreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center
}

#fullscreen img{
max-width:90%;
max-height:90%
}
</style>
</head>

<body>

<div id="app">

<div id="header">
<img src="perfil.jpg">
<div>
<b>Yasmin</b><br>
<span id="status">online agora</span>
</div>
</div>

<div id="chat"></div>

<div id="footer">
<input id="msgInput" placeholder="Digite...">
<button id="sendBtn" onclick="sendUser()">➤</button>
</div>

</div>

<div id="fullscreen" onclick="this.style.display='none'">
<img>
</div>

<audio id="notif" src="notif.mp3"></audio>

<script>

const chat=document.getElementById("chat")
const statusTxt=document.getElementById("status")
const notif=document.getElementById("notif")

const sleep=ms=>new Promise(r=>setTimeout(r,ms))

function vibrate(){
 if(navigator.vibrate) navigator.vibrate(80)
}

function playNotif(){
 notif.play().catch(()=>{})
}

function scroll(){
 chat.scrollTop=chat.scrollHeight
}

function setStatus(t){
 statusTxt.textContent=t
}

function msg(text,who="them"){
 const row=document.createElement("div")
 row.className="msg"

 if(who==="them"){
  const av=document.createElement("img")
  av.src="perfil.jpg"
  av.className="avatar"
  row.appendChild(av)
 }

 const b=document.createElement("div")
 b.className="bubble "+who
 b.innerHTML=text

 row.appendChild(b)
 chat.appendChild(row)

 playNotif()
 vibrate()
 scroll()
}

function typing(){
 setStatus("digitando...")
 const t=document.createElement("div")
 t.className="typing"
 t.textContent="..."
 chat.appendChild(t)
 scroll()
 return t
}

function mic(){
 setStatus("gravando áudio...")
 const m=document.createElement("div")
 m.className="mic"
 m.textContent="🎤 gravando áudio..."
 chat.appendChild(m)
 scroll()
 return m
}

function sendAudio(src){
 setStatus("online agora")

 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const box=document.createElement("div")
 box.className="bubble them audio"
 box.innerHTML=`<audio controls src="${src}"></audio>`

 row.appendChild(av)
 row.appendChild(box)
 chat.appendChild(row)

 playNotif()
 vibrate()
 scroll()
}

function sendPhoto(src){
 setStatus("online agora")

 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const img=document.createElement("img")
 img.src=src
 img.className="chat-img"
 img.onclick=()=>openFull(src)

 const b=document.createElement("div")
 b.className="bubble them"
 b.appendChild(img)

 row.appendChild(av)
 row.appendChild(b)
 chat.appendChild(row)

 playNotif()
 vibrate()
 scroll()
}

function openFull(src){
 const fs=document.getElementById("fullscreen")
 fs.style.display="flex"
 fs.querySelector("img").src=src
}

function sendUser(){
 const i=document.getElementById("msgInput")
 if(!i.value.trim())return
 msg(i.value,"me")
 i.value=""
}

async function waitText(){
 const t=typing()
 await sleep(5000)
 t.remove()
 setStatus("online agora")
}

async function waitAudio(){
 const m=mic()
 await sleep(10000)
 m.remove()
}

async function waitImage(){
 const t=typing()
 await sleep(7000)
 t.remove()
 setStatus("online agora")
}

async function start(){

 await waitText()
 msg("oii amor 😅 tô sozinha agora")

 await waitText()
 msg("quer ver umas fotinhas minhas?")

 await waitText()
 msg('<button onclick="choice()">Sim</button><button onclick="choice()">Quero ver</button>')
}

async function choice(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio(); sendAudio("audio1.mp3")

 await waitImage(); sendPhoto("foto1.jpg")
 await waitImage(); sendPhoto("foto2.jpg")

 await waitAudio(); sendAudio("audio2.mp3")

 await waitText()
 msg("ando muito sozinha ultimamente 😔")

 await waitText()
 msg("quer ver meus conteúdos exclusivos?")

 await waitText()
 msg('<button onclick="content()">Quero</button><button onclick="content()">Claro</button>')
}

async function content(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio(); sendAudio("audio3.mp3")
 await waitAudio(); sendAudio("audio4.mp3")

 await waitText()
 msg("vou te mandar o link amor ❤️")

 await waitAudio(); sendAudio("audio5.mp3")

 await waitText()
 msg('<b><a style="color:#ff66a3" href="#">👉 PAGAR AGORA</a></b>')

 await waitAudio(); sendAudio("audio6.mp3")
 await waitAudio(); sendAudio("audio7.mp3")
 await waitAudio(); sendAudio("audio8.mp3")

 await waitText()
 msg("última chance hoje 😭")
}

start()

</script>

</body>
</html>
