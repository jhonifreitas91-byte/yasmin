<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Conversa</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

:root{
--bg:#0a0a0a;
--bg-chat:#0f0f0f;
--bubble-them:#2a0f3a;
--bubble-me:#ff0055;
--text:#fff;
--typing:#ff66a3;
--border:#ff0055;
--shadow:0 0 12px #ff005588
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
background:var(--bg);
font-family:Inter;
display:flex;
justify-content:center;
align-items:center
}

#wrap{
width:100%;
max-width:420px;
height:100%;
background:var(--bg);
border:1px solid var(--border);
box-shadow:var(--shadow);
display:flex;
flex-direction:column
}

#header{
background:#1a1a1a;
display:flex;
align-items:center;
padding:10px 14px;
gap:12px;
color:#fff
}

#header img{
width:44px;
height:44px;
border-radius:50%;
border:2px solid var(--border)
}

#chat{
flex:1;
background:var(--bg-chat);
padding:10px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px;
scroll-behavior:smooth
}

.msg{
display:flex;
align-items:flex-end;
gap:6px
}

.avatar{
width:32px;
height:32px;
border-radius:50%;
border:2px solid var(--border)
}

.bubble{
max-width:72%;
padding:10px 14px;
border-radius:20px;
font-size:15px;
line-height:1.35;
box-shadow:var(--shadow)
}

.them{
background:var(--bubble-them);
color:#fff;
border-bottom-left-radius:6px
}

.me{
background:var(--bubble-me);
color:#fff;
border-bottom-right-radius:6px;
margin-left:auto
}

.typing{
margin-left:38px;
font-size:26px;
font-weight:700;
color:var(--typing);
letter-spacing:.2em;
animation:blink 1s infinite
}

@keyframes blink{50%{opacity:0}}

#footer{
background:#1a1a1a;
display:flex;
align-items:center;
padding:10px;
gap:10px;
position:sticky;
bottom:0
}

#msgInput{
flex:1;
background:#2a0f3a;
border:1px solid var(--border);
padding:12px 16px;
border-radius:24px;
color:#fff;
font-size:16px
}

#sendBtn{
background:var(--bubble-me);
color:#fff;
border:0;
padding:12px 14px;
border-radius:50%;
cursor:pointer;
font-size:18px;
box-shadow:var(--shadow)
}

.audio-block{
display:flex;
align-items:center;
padding:6px 10px;
background:var(--bubble-them);
border-radius:18px;
width:200px
}

button{
background:#ff0055;
color:#fff;
border:0;
padding:8px 14px;
border-radius:16px;
cursor:pointer;
margin:4px
}
</style>
</head>

<body>

<div id="wrap">

<div id="header">
<img src="perfil.jpg">
<div><b>Yasmin Miahira</b></div>
</div>

<div id="chat"></div>

<div id="footer">
<input id="msgInput" placeholder="Digite uma mensagem">
<button id="sendBtn" onclick="sendMsg()">➤</button>
</div>

</div>

<script>

const chat = document.getElementById("chat")
const input = document.getElementById("msgInput")

const rand = (a,b)=>Math.random()*(b-a)+a
const sleep = ms => new Promise(r=>setTimeout(r,ms))

function scroll(){
 chat.scrollTop = chat.scrollHeight
}

function bubble(text,who="them"){
 const row=document.createElement("div")
 row.className="msg"

 if(who==="them"){
   const av=document.createElement("img")
   av.src="perfil.jpg"
   av.className="avatar"
   row.appendChild(av)
 }

 const b=document.createElement("div")
 b.className="bubble "+who
 b.innerHTML=text

 row.appendChild(b)
 chat.appendChild(row)
 scroll()
}

function typing(){
 const t=document.createElement("div")
 t.className="typing"
 t.textContent="..."
 chat.appendChild(t)
 scroll()
 return t
}

async function humanTyping(){
 const t=typing()
 await sleep(rand(1200,4200))
 t.remove()
}

function sendMsg(){
 if(!input.value.trim()) return
 bubble(input.value,"me")
 input.value=""
}

function sendAudio(src){
 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const box=document.createElement("div")
 box.className="bubble them audio-block"
 box.innerHTML=`<audio controls src="${src}"></audio>`

 row.appendChild(av)
 row.appendChild(box)
 chat.appendChild(row)
 scroll()
}

function sendPhoto(src){
 const img=new Image()
 img.src=src
 img.style.maxWidth="220px"
 img.style.borderRadius="12px"

 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const b=document.createElement("div")
 b.className="bubble them"

 b.appendChild(img)
 row.appendChild(av)
 row.appendChild(b)
 chat.appendChild(row)
 scroll()
}

async function start(){

 await humanTyping()
 bubble("oiii amorzinho rs 😅 to aqui sozinha no quarto...")

 await humanTyping()
 bubble("meu noivo chega em uns 20 min... quer ver uma fotinha?")

 await humanTyping()
 bubble('<button onclick="escolhe()">Sim, quero ver</button><button onclick="escolhe()">Claro, quero ver</button>')
}

async function escolhe(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await humanTyping()
 sendAudio("audio1.mp3")

 await sleep(rand(2500,4500))
 sendPhoto("foto1.jpg")

 await sleep(rand(2000,4000))
 sendPhoto("foto2.jpg")

 await humanTyping()
 bubble("ultimamente tô me sentindo tão sozinha 😔 ele nem me dá atenção...")

 await humanTyping()
 bubble("então comecei a vender uns conteúdos meus rsrs 🙈")

 await humanTyping()
 bubble("vc tem interesse em ver?")

 await humanTyping()
 bubble('<button onclick="mostraConteudo()">Sim</button><button onclick="mostraConteudo()">Claro</button>')
}

async function mostraConteudo(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await humanTyping()
 sendAudio("audio3.mp3")

 await humanTyping()
 sendAudio("audio4.mp3")

 await humanTyping()
 bubble("então amor... quer gozar bem gostoso comigo hoje? 😈")

 await humanTyping()
 bubble('<button onclick="finaliza()">Sim</button><button onclick="finaliza()">Claro</button>')
}

async function finaliza(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await humanTyping()
 sendAudio("audio5.mp3")

 await humanTyping()
 bubble("vou deixar o link aqui embaixo pra vc pagar baratinho tá 💕")

 await humanTyping()
 bubble('<b><a href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334" style="color:#ff66a3">👉 CLIQUE AQUI</a></b>')

 await humanTyping()
 bubble("promoção só de hoje 😘 depois vai aumentar")

 await humanTyping()
 sendAudio("audio6.mp3")

 await humanTyping()
 sendAudio("audio7.mp3")

 await humanTyping()
 bubble("último aviso amorzinho 😭 se sair agora vai perder")

 await humanTyping()
 bubble('<b><a href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334" style="color:#ff66a3">👉 CLIQUE AQUI AGORA</a></b>')
}

start()

</script>

</body>
</html>
