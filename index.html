<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🔓</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font:14px Arial;display:flex;justify-content:center;align-items:center;height:100vh}
#chat{width:100%;max-width:420px;height:100%;max-height:740px;background:#000;display:flex;flex-direction:column}
#log{flex:1;padding:12px;overflow-y:auto}
.msg{margin:4px 0;display:flexbox}
.them{background:#222;padding:8px 12px;border-radius:0 14px 14px 14px;max-width:70%}
.me{background:#005fff;padding:8px 12px;border-radius:14px 0 14px 14px;margin-left:auto}
.typing{font-size:12px;color:#aaa;margin:4px 0}
#mic{width:28px;height:28px;background:url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIGZpbGw9IiNmZmYiIHZpZXdCb3g9IjAgMCAyNCAyNCI+PHBhdCBkPSJNMTIgMTR2MmE2IDYgMCAwIDAtNiA2aDJhOCA4IDAgMCAwIDgtOHYtMmgtMnptLTQgNGEyIDIgMCAwIDEgMi0ydjJhMiAyIDAgMC0yIDJ2LTJ6Ii8+PC9zdmc+') no-repeat center;background-size:70%}
.audio-block{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#222;border-radius:18px;width:180px}
audio::-webkit-media-controls-panel{background-color:#222}
#payBtn{background:#00d4aa;color:#000;border:0;padding:14px;width:100%;font-size:18px;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<div id="chat">
  <div id="log"></div>
</div>

<script>
const log=document.getElementById('log');
const fotos=['foto1.jpg','foto2.jpg'];
const audios=['audio1.mp3','audio2.mp3'];

function add(msg,cl='them'){
  const d=document.createElement('div');
  d.className='msg '+cl;
  d.innerHTML=msg;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function typing(){
  const t=document.createElement('div');
  t.className='typing';
  t.id='typing';
  t.textContent='...';
  log.appendChild(t);
  log.scrollTop=log.scrollHeight;
  return t;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function start(){
  add('Oi, sou eu mesma... tô gravando aqui sozinha no quarto mas não posso ficar muito.');
  await sleep(2500);
  add('Meu noivo chega em 20 min. Tem interesse em ver as fotos que eu tirei?');
  await sleep(1800);
  add('<button onclick="escolhe(true)" style="margin:4px;padding:8px 16px;background:#005fff;border:0;color:#fff;border-radius:20px;cursor:pointer">Sim, quero ver</button><button onclick="escolhe(false)" style="margin:4px;padding:8px 16px;background:#005fff;border:0;color:#fff;border-radius:20px;cursor:pointer">Claro, quero ver</button>','them');
}
async function escolhe(dummy){
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  /* --- envia as 2 fotos --- */
  for(const f of fotos){
    const img=new Image();
    img.src=f;
    img.style.maxWidth='220px';
    img.style.borderRadius='12px';
    const div=document.createElement('div');
    div.className='msg them';
    div.appendChild(img);
    log.appendChild(div);
    await sleep(600);
  }
  await sleep(1200);
  add('Vê rapidinho que eu tenho que sair, mas olha, isso é só um pouquinho do que eu tenho a te oferecer.');
  await sleep(2100);
  add('Se quiser ver todas as minhas fotos e vídeos que separei especialmente pra você é só clicar abaixo e adquirir o meu pacote VIP.');
  await sleep(1500);
  /* --- digitação + áudios --- */
  for(const a of audios){
    const t=typing();
    await sleep(1200);
    t.remove();
    const box=document.createElement('div');
    box.className='msg them audio-block';
    box.innerHTML='<div id="mic"></div><audio controls src="'+a+'"></audio>';
    log.appendChild(box);
    await sleep(5000);
  }
  await sleep(800);
  add('<b><a href="pagamento.html" style="color:#00d4aa">👉 CLIQUE AQUI e garanta seu pack por R$ 19,90</a></b>');
  await sleep(1000);
  add('Aproveita que logo logo eu apago tudo, agora vou sair que meu marido chegou. Beijos, te espero lá!');
}
start();
</script>
</body>
</html>
