<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

:root{
--bg:#0b0b0b;
--chat:#111;
--them:#2a0f3a;
--me:#ff0055;
--border:#ff0055;
--txt:#fff;
--shadow:0 0 12px #ff005580
}

*{box-sizing:border-box;margin:0}
html,body{height:100%}

body{
background:var(--bg);
display:flex;
justify-content:center;
align-items:center;
font-family:Inter
}

#wrap{
width:100%;
max-width:420px;
height:100%;
display:flex;
flex-direction:column;
border:1px solid var(--border);
box-shadow:var(--shadow)
}

#header{
background:#1a1a1a;
padding:10px;
display:flex;
align-items:center;
gap:10px;
color:#fff
}

#header img{
width:42px;height:42px;
border-radius:50%;
border:2px solid var(--border)
}

#chat{
flex:1;
background:var(--chat);
padding:12px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:10px;
scroll-behavior:smooth
}

.msg{display:flex;gap:8px;align-items:flex-end}

.avatar{
width:30px;height:30px;
border-radius:50%;
border:2px solid var(--border)
}

.bubble{
max-width:72%;
padding:10px 14px;
border-radius:20px;
font-size:15px;
box-shadow:var(--shadow)
}

.them{background:var(--them);color:#fff;border-bottom-left-radius:6px}
.me{background:var(--me);color:#fff;border-bottom-right-radius:6px;margin-left:auto}

.typing{
margin-left:38px;
font-size:26px;
color:#ff66a3;
letter-spacing:.2em;
animation:blink 1s infinite
}

@keyframes blink{50%{opacity:0}}

.mic{
margin-left:38px;
font-size:22px;
color:#ff66a3;
animation:pulse 1s infinite
}

@keyframes pulse{50%{opacity:.3}}

#footer{
background:#1a1a1a;
padding:10px;
display:flex;
gap:10px
}

#msgInput{
flex:1;
background:#2a0f3a;
border:1px solid var(--border);
border-radius:22px;
padding:12px 14px;
color:#fff
}

#sendBtn{
background:var(--me);
border:0;
color:#fff;
padding:12px;
border-radius:50%;
cursor:pointer
}

.audio{
background:var(--them);
padding:6px 10px;
border-radius:18px;
width:200px
}

button{
background:#ff0055;
border:0;
color:white;
padding:8px 14px;
border-radius:16px;
margin:4px;
cursor:pointer
}
</style>
</head>

<body>

<div id="wrap">

<div id="header">
<img src="perfil.jpg">
<b>Yasmin Miahira</b>
</div>

<div id="chat"></div>

<div id="footer">
<input id="msgInput" placeholder="Digite uma mensagem">
<button id="sendBtn" onclick="sendMsg()">➤</button>
</div>

</div>

<script>

const chat=document.getElementById("chat")
const input=document.getElementById("msgInput")

const sleep=ms=>new Promise(r=>setTimeout(r,ms))

function scroll(){chat.scrollTop=chat.scrollHeight}

function bubble(text,who="them"){
 const row=document.createElement("div")
 row.className="msg"

 if(who==="them"){
   const av=document.createElement("img")
   av.src="perfil.jpg"
   av.className="avatar"
   row.appendChild(av)
 }

 const b=document.createElement("div")
 b.className="bubble "+who
 b.innerHTML=text

 row.appendChild(b)
 chat.appendChild(row)
 scroll()
}

function typing(){
 const t=document.createElement("div")
 t.className="typing"
 t.textContent="..."
 chat.appendChild(t)
 scroll()
 return t
}

function mic(){
 const m=document.createElement("div")
 m.className="mic"
 m.textContent="🎤 gravando..."
 chat.appendChild(m)
 scroll()
 return m
}

function sendMsg(){
 if(!input.value.trim()) return
 bubble(input.value,"me")
 input.value=""
}

function sendAudio(src){
 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const box=document.createElement("div")
 box.className="bubble them audio"
 box.innerHTML=`<audio controls src="${src}"></audio>`

 row.appendChild(av)
 row.appendChild(box)
 chat.appendChild(row)
 scroll()
}

function sendPhoto(src){
 const img=new Image()
 img.src=src
 img.style.maxWidth="220px"
 img.style.borderRadius="12px"

 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const b=document.createElement("div")
 b.className="bubble them"

 b.appendChild(img)
 row.appendChild(av)
 row.appendChild(b)
 chat.appendChild(row)
 scroll()
}

async function waitText(){
 const t=typing()
 await sleep(5000)
 t.remove()
}

async function waitAudio(){
 const m=mic()
 await sleep(10000)
 m.remove()
}

async function waitImage(){
 const t=typing()
 await sleep(7000)
 t.remove()
}

async function start(){

 await waitText()
 bubble("oii meu amorzinho rs 😅 to aqui sozinha no quarto mas não posso ficar muito")

 await waitText()
 bubble("meu noivo chega em 20 min... quer ver uma fotinha?")

 await waitText()
 bubble('<button onclick="escolhe()">Sim, quero ver</button><button onclick="escolhe()">Claro, quero ver</button>')
}

async function escolhe(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio()
 sendAudio("audio1.mp3")

 await waitImage()
 sendPhoto("foto1.jpg")

 await waitImage()
 sendPhoto("foto2.jpg")

 await waitText()
 bubble("ultimamente tô me sentindo sozinha... o corno do meu marido não me deixa sair de casa 😔")

 await waitText()
 bubble("então a única opção agora é vender foto da minha bucetinha rsrs 🙈")

 await waitText()
 bubble("tem interesse em ver meus conteúdos?")

 await waitText()
 bubble('<button onclick="mostraConteudo()">Sim, quero muito</button><button onclick="mostraConteudo()">Claro que sim</button>')
}

async function mostraConteudo(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio()
 sendAudio("audio3.mp3")

 await waitAudio()
 sendAudio("audio4.mp3")

 await waitText()
 bubble("então meu neném... tá afim de gozar bem gostoso comigo? 😈")

 await waitText()
 bubble('<button onclick="finaliza()">Sim</button><button onclick="finaliza()">Claro</button>')
}

async function finaliza(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio()
 sendAudio("audio5.mp3")

 await waitText()
 bubble("vou deixar o link aqui embaixo pra você fazer o pagamento tá amor ❤️")

 await waitText()
 bubble('<b><a style="color:#ff66a3" href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334">👉 CLIQUE AQUI</a></b>')

 await waitText()
 bubble("tô cobrando baratinho, vc ganha e eu ganho 😘")

 await waitAudio()
 sendAudio("audio6.mp3")

 await waitAudio()
 sendAudio("audio7.mp3")

 await waitText()
 bubble("se sair agora vai perder a promoção de hoje 😭 último aviso")

 await waitText()
 bubble('<b><a style="color:#ff66a3" href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334">👉 CLIQUE AQUI AGORA</a></b>')
}

start()

</script>
</body>
</html>
