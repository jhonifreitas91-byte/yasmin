<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Chat</title>

<style>
body{
margin:0;
background:#0b0b0b;
font-family:Arial,Helvetica,sans-serif;
display:flex;
justify-content:center;
height:100vh
}

#app{
width:100%;
max-width:420px;
background:#111;
display:flex;
flex-direction:column;
border:1px solid #ff0055;
height:100vh;
position:relative
}

#header{
background:#1a1a1a;
padding:10px;
display:flex;
gap:10px;
align-items:center;
color:#fff;
flex-shrink:0
}

#header img{
width:42px;
height:42px;
border-radius:50%;
border:2px solid #ff0055
}

#status{
font-size:12px;
color:#ff66a3
}

#chat{
flex:1;
overflow-y:auto;
padding:12px;
display:flex;
flex-direction:column;
gap:10px;
padding-bottom:80px;
scroll-behavior:smooth
}

.msg{
display:flex;
gap:8px;
align-items:flex-end
}

.avatar{
width:30px;
height:30px;
border-radius:50%;
border:2px solid #ff0055
}

.bubble{
padding:10px 14px;
border-radius:18px;
max-width:75%;
color:#fff;
font-size:15px
}

.them{background:#2a0f3a}
.me{background:#ff0055;margin-left:auto}

.typing{
margin-left:38px;
display:flex;
gap:6px
}

.dot{
width:10px;
height:10px;
background:#ff66a3;
border-radius:50%;
animation:jump 1.4s infinite ease-in-out;
opacity:.3
}

.dot:nth-child(1){animation-delay:0s}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}

@keyframes jump{
0%,80%,100%{transform:translateY(0);opacity:.3}
40%{transform:translateY(-6px);opacity:1}
}

.mic{
margin-left:38px;
color:#ff66a3;
font-size:14px
}

.audio audio{
width:200px
}

.chat-img{
max-width:220px;
border-radius:12px;
cursor:pointer
}

#footer{
position:fixed;
bottom:0;
width:100%;
max-width:420px;
background:#1a1a1a;
padding:10px;
display:flex;
gap:8px;
box-sizing:border-box
}

#msgInput{
flex:1;
background:#2a0f3a;
border:1px solid #ff0055;
border-radius:20px;
padding:12px;
color:#fff;
opacity:.6
}

#sendBtn{
background:#ff0055;
border:0;
color:white;
border-radius:50%;
padding:12px;
cursor:not-allowed;
opacity:.6
}

button{
background:#ff0055;
border:0;
color:white;
padding:8px 14px;
border-radius:16px;
margin:4px;
cursor:pointer
}

#fullscreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center
}

#fullscreen img{
max-width:90%;
max-height:90%
}
</style>
</head>

<body>

<div id="app">

<div id="header">
<img src="perfil.jpg">
<div>
<b>Yasmin Miahira</b><br>
<span id="status">online agora</span>
</div>
</div>

<div id="chat"></div>

<div id="footer">
<input id="msgInput" placeholder="Digite uma mensagem" disabled>
<button id="sendBtn" disabled>➤</button>
</div>

</div>

<div id="fullscreen" onclick="this.style.display='none'">
<img>
</div>

<script>

const chat=document.getElementById("chat")
const statusTxt=document.getElementById("status")
const sleep=ms=>new Promise(r=>setTimeout(r,ms))

function scroll(){ chat.scrollTop=chat.scrollHeight }

function msg(text){
 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const b=document.createElement("div")
 b.className="bubble them"
 b.innerHTML=text

 row.appendChild(av)
 row.appendChild(b)
 chat.appendChild(row)
 scroll()
}

function typing(){
 statusTxt.textContent="digitando..."
 const t=document.createElement("div")
 t.className="typing"
 t.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>'
 chat.appendChild(t)
 scroll()
 return t
}

function mic(){
 statusTxt.textContent="gravando áudio..."
 const m=document.createElement("div")
 m.className="mic"
 m.textContent="🎤 gravando áudio..."
 chat.appendChild(m)
 scroll()
 return m
}

function sendAudio(src){
 statusTxt.textContent="online agora"

 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const box=document.createElement("div")
 box.className="bubble them audio"
 box.innerHTML=`<audio controls src="${src}"></audio>`

 row.appendChild(av)
 row.appendChild(box)
 chat.appendChild(row)
 scroll()
}

function sendPhoto(src){
 statusTxt.textContent="online agora"

 const row=document.createElement("div")
 row.className="msg"

 const av=document.createElement("img")
 av.src="perfil.jpg"
 av.className="avatar"

 const img=document.createElement("img")
 img.src=src
 img.className="chat-img"
 img.onclick=()=>openFull(src)

 const b=document.createElement("div")
 b.className="bubble them"
 b.appendChild(img)

 row.appendChild(av)
 row.appendChild(b)
 chat.appendChild(row)
 scroll()
}

function openFull(src){
 const fs=document.getElementById("fullscreen")
 fs.style.display="flex"
 fs.querySelector("img").src=src
}

async function waitText(){
 const t=typing()
 await sleep(5000)
 t.remove()
 statusTxt.textContent="online agora"
}

async function waitAudio(){
 const m=mic()
 await sleep(10000)
 m.remove()
}

async function waitImage(){
 const t=typing()
 await sleep(7000)
 t.remove()
 statusTxt.textContent="online agora"
}

async function start(){

 await waitText()
 msg("oii, meu amorzinho rs, to aqui sozinha no quarto mas não posso ficar muito.")

 await waitText()
 msg("meu noivo chega em 20 min, quer ver uma fotinha?")

 await waitText()
 msg('<button onclick="choice()">Sim, quero ver</button><button onclick="choice()">Claro, quero ver</button>')
}

async function choice(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio(); sendAudio("audio1.mp3")

 await waitImage(); sendPhoto("foto1.jpg")
 await waitImage(); sendPhoto("foto2.jpg")

 await waitAudio(); sendAudio("audio2.mp3")

 await waitText()
 msg("ultimamente estou me sentindo sozinha, o corno do meu marido não me deixa sair de casa e estou sem trabalhar, então a unica opção agora é vender foto da minha bucetinha rsrsrs")

 await waitText()
 msg("tem interesse em ver meus conteúdos?")

 await waitText()
 msg('<button onclick="content()">Sim, quero muito</button><button onclick="content()">Claro que sim</button>')
}

async function content(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio(); sendAudio("audio3.mp3")
 await waitAudio(); sendAudio("audio4.mp3")

 await waitText()
 msg("então meu nenem, ta afim de gozar bem gostoso cmg?")

 await waitText()
 msg('<button onclick="final()">Sim</button><button onclick="final()">Claro</button>')
}

async function final(){
 document.querySelectorAll("button").forEach(b=>b.disabled=true)

 await waitAudio(); sendAudio("audio5.mp3")

 await waitText()
 msg("aqui em baixo vou deixar o link pra voce fazer o pagamento ta amor?")

 await waitText()
 msg('<b><a style="color:#ff66a3" href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334">👉 CLIQUE AQUI</a></b>')

 await waitAudio(); sendAudio("audio6.mp3")
 await waitAudio(); sendAudio("audio7.mp3")
 await waitAudio(); sendAudio("audio8.mp3")

 await waitText()
 msg("Se você sair agora, vai perder a promoção de hoje. Último aviso, amor:")
}

start()

</script>

</body>
</html>
