<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Realista</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

:root{
--bg:#0a0a0a;
--chat:#0f0f0f;
--them:#2a0f3a;
--me:#ff0055;
--border:#ff0055;
--txt:#fff;
--shadow:0 0 12px #ff005580
}

*{box-sizing:border-box}
body{
margin:0;height:100vh;
background:var(--bg);
display:flex;justify-content:center;align-items:center;
font-family:Inter
}

#wrap{
width:100%;max-width:420px;height:100%;
border:1px solid var(--border);
box-shadow:var(--shadow);
display:flex;flex-direction:column
}

#header{
background:#1a1a1a;
padding:10px;
display:flex;gap:10px;align-items:center;
color:#fff
}

#header img{width:44px;height:44px;border-radius:50%;border:2px solid var(--border)}

#chat{
flex:1;
background:var(--chat);
padding:12px;
overflow-y:auto;
scroll-behavior:smooth
}

.msg{display:flex;gap:8px;margin-bottom:8px}

.avatar{width:32px;height:32px;border-radius:50%;border:2px solid var(--border)}

.bubble{
max-width:72%;
padding:10px 14px;
border-radius:20px;
font-size:15px;
box-shadow:var(--shadow)
}

.them{background:var(--them);color:#fff;border-bottom-left-radius:6px}
.me{background:var(--me);margin-left:auto;color:#fff;border-bottom-right-radius:6px}

.typing{
margin-left:40px;
font-size:22px;
letter-spacing:.2em;
animation:pulse 1s infinite;
color:#ff66a3
}

@keyframes pulse{50%{opacity:0}}

.loading{
width:200px;height:120px;
background:#222;
border-radius:12px;
animation:blur 1.5s infinite
}

@keyframes blur{50%{opacity:.4}}

.audio{
padding:6px 10px;
background:var(--them);
border-radius:18px;
width:200px
}

button{
background:#ff0055;
color:white;
border:0;
padding:8px 14px;
border-radius:16px;
cursor:pointer;
margin:4px
}
</style>
</head>

<body>
<div id="wrap">

<div id="header">
<img src="perfil.jpg">
<b>Yasmin Miahira</b>
</div>

<div id="chat"></div>

</div>

<script>

const chat = document.getElementById("chat")

const rand = (a,b)=>Math.random()*(b-a)+a
const wait = ms => new Promise(r=>setTimeout(r,ms))

function scroll(){
 chat.scrollTop = chat.scrollHeight
}

function row(who){
 const r=document.createElement("div")
 r.className="msg"
 if(who==="them"){
   const a=document.createElement("img")
   a.src="perfil.jpg"
   a.className="avatar"
   r.appendChild(a)
 }
 return r
}

async function typing(delay){
 const t=document.createElement("div")
 t.className="typing"
 t.textContent="..."
 chat.appendChild(t)
 scroll()
 await wait(delay)
 t.remove()
}

async function typeText(text){
 const r=row("them")
 const b=document.createElement("div")
 b.className="bubble them"
 r.appendChild(b)
 chat.appendChild(r)
 scroll()

 let s=""
 for(const l of text){
   s+=l
   b.textContent=s
   await wait(rand(20,70))
 }
}

async function fakeUser(msg){
 const r=document.createElement("div")
 r.className="msg"
 const b=document.createElement("div")
 b.className="bubble me"
 b.textContent=msg
 r.appendChild(b)
 chat.appendChild(r)
 scroll()
}

async function sendAudio(src){
 const r=row("them")
 const b=document.createElement("div")
 b.className="audio bubble them"
 b.innerHTML=`<audio controls src="${src}"></audio>`
 r.appendChild(b)
 chat.appendChild(r)
 scroll()
}

async function sendPhoto(src){
 const r=row("them")
 const b=document.createElement("div")
 b.className="bubble them"

 const load=document.createElement("div")
 load.className="loading"
 b.appendChild(load)
 r.appendChild(b)
 chat.appendChild(r)
 scroll()

 await wait(rand(1500,3000))

 load.remove()
 const img=new Image()
 img.src=src
 img.style.maxWidth="220px"
 img.style.borderRadius="12px"
 b.appendChild(img)
 scroll()
}

async function start(){

 await typing(rand(1500,3000))
 await typeText("oiii amor rs 😅 to aqui sozinha no quarto...")

 await typing(rand(2000,4000))
 await typeText("meu noivo chega em uns 20 min... quer ver uma fotinha?")

 await wait(1500)
 await fakeUser("quero sim 😍")

 await typing(rand(3000,5000))
 await sendAudio("audio1.mp3")

 await typing(rand(1500,3000))
 await sendPhoto("foto1.jpg")

 await typing(rand(1200,2500))
 await sendPhoto("foto2.jpg")

 await wait(1200)
 await fakeUser("nossa vc é linda demais 😳")

 await typing(rand(3000,5000))
 await sendAudio("audio2.mp3")

 await typing(rand(2000,4000))
 await typeText("ultimamente tô me sentindo tão sozinha 😔 ele nem me dá atenção mais...")

 await typing(rand(2000,4000))
 await typeText("então comecei a vender uns conteúdos meus rsrs 🙈")

 await typing(rand(1500,3000))
 await typeText("vc teria interesse em ver?")

 await wait(1200)
 await fakeUser("claro que sim 😍")

 await typing(rand(3000,5000))
 await sendAudio("audio3.mp3")

 await typing(rand(2500,4500))
 await sendAudio("audio4.mp3")

 await typing(rand(2000,4000))
 await typeText("então amor... quer gozar bem gostoso comigo hoje? 😈")

 await wait(1200)
 await fakeUser("quero muito 🔥")

 await typing(rand(3000,5000))
 await sendAudio("audio5.mp3")

 await typing(rand(2000,4000))
 await typeText("vou deixar o link aqui embaixo pra vc pagar bem baratinho tá 💕")

 await typing(rand(1500,3000))
 const r=row("them")
 const b=document.createElement("div")
 b.className="bubble them"
 b.innerHTML='<b><a style="color:#ff66a3" href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334">👉 CLIQUE AQUI</a></b>'
 r.appendChild(b)
 chat.appendChild(r)
 scroll()

 await typing(rand(2000,4000))
 await typeText("é promoção de hoje só 😘 depois vai aumentar viu")

 await typing(rand(3000,5000))
 await sendAudio("audio6.mp3")

 await typing(rand(3000,5000))
 await sendAudio("audio7.mp3")

 await typing(rand(2000,4000))
 await typeText("se sair agora vai perder amorzinho 😭 último aviso")

 await typing(rand(1500,3000))
 const r2=row("them")
 const b2=document.createElement("div")
 b2.className="bubble them"
 b2.innerHTML='<b><a style="color:#ff66a3" href="https://seguro.modelosprivacy.club/api/public/shopify?product=1733412255316&store=17334">👉 CLIQUE AQUI AGORA</a></b>'
 r2.appendChild(b2)
 chat.appendChild(r2)
 scroll()
}

start()

</script>
</body>
</html>
