<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Conversa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#111;font-family:Arial;display:flex;justify-content:center;align-items:center}
#wrap{width:100%;max-width:420px;height:100%;background:#000;display:flex;flex-direction:column}
#header{background:#202c33;display:flex;align-items:center;padding:8px 12px;gap:12px;color:#fff}
#header img{width:40px;height:40px;border-radius:50%}
#nome{flex:1;font-size:16px}
#chat{flex:1;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;align-items:flex-end;gap:6px}
.bubble{max-width:70%;padding:8px 12px;border-radius:18px;font-size:14px}
.them{background:#202c33;color:#fff;border-bottom-left-radius:4px}
.me{background:#005fff;color:#fff;border-bottom-right-radius:4px;margin-left:auto}
.avatar{width:28px;height:28px;border-radius:50%}
.typing{margin-left:34px;font-size:12px;color:#8696a0}
#footer{background:#202c33;display:flex;align-items:center;padding:8px;gap:8px;position:sticky;bottom:0}
#msgInput{flex:1;background:#2a3942;border:0;padding:10px 14px;border-radius:24px;color:#fff;font-size:16px}
#sendBtn{background:#005fff;color:#fff;border:0;padding:10px 14px;border-radius:50%;cursor:pointer}
.audio-block{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#202c33;border-radius:18px;width:180px}
audio::-webkit-media-controls-panel{background:#202c33}
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <img src="perfil.jpg">
    <div id="nome">Modelo  🔒</div>
  </div>
  <div id="chat"></div>
  <div id="footer">
    <input id="msgInput" placeholder="Digite uma mensagem">
    <button id="sendBtn" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('msgInput');

function bubble(text,who='them'){
  const row=document.createElement('div');row.className='msg';
  if(who==='them'){
    const av=document.createElement('img');av.src='perfil.jpg';av.className='avatar';row.appendChild(av);
  }
  const b=document.createElement('div');b.className='bubble '+who;b.innerHTML=text;
  row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
}
function typing(){
  const t=document.createElement('div');t.className='typing';t.textContent='...';
  chat.appendChild(t);chat.scrollTop=chat.scrollHeight;return t;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function start(){
  let t=typing();await sleep(5000);t.remove();
  bubble('Oi, sou eu mesma... tô gravando aqui sozinha no quarto mas não posso ficar muito.');
  await sleep(2000);t=typing();await sleep(6000);t.remove();
  bubble('Meu noivo chega em 20 min. Tem interesse em ver as fotos que eu tirei?');
  await sleep(2000);t=typing();await sleep(6000);t.remove();
  bubble('<button onclick="escolhe()">Sim, quero ver</button><button onclick="escolhe()">Claro, quero ver</button>');
}
async function escolhe(){
  document.querySelectorAll('button').forEach(b=>b.disabled=true);
  for(const f of ['foto1.jpg','foto2.jpg']){
    const img=new Image();img.src=f;img.style.maxWidth='220px';img.style.borderRadius='12px';
    const row=document.createElement('div');row.className='msg';
    const av=document.createElement('img');av.src='perfil.jpg';av.className='avatar';row.appendChild(av);
    const b=document.createElement('div');b.className='bubble them';b.appendChild(img);row.appendChild(b);
    chat.appendChild(row);chat.scrollTop=chat.scrollHeight;await sleep(600);
  }
  await sleep(2000);let t=typing();await sleep(6000);t.remove();
  bubble('Vê rapidinho que eu tenho que sair, mas olha, isso é só um pouquinho do que eu tenho a te oferecer.');
  await sleep(2000);t=typing();await sleep(6000);t.remove();
  bubble('Se quiser ver todas as minhas fotos e vídeos que separei especialmente pra você, clique abaixo e adquira o meu pacote VIP.');
  await sleep(2000);
  for(const a of ['audio1.mp3','audio2.mp3']){
    t=typing();await sleep(6000);t.remove();
    const row=document.createElement('div');row.className='msg';
    const av=document.createElement('img');av.src='perfil.jpg';av.className='avatar';row.appendChild(av);
    const box=document.createElement('div');box.className='bubble them audio-block';
    box.innerHTML='<audio controls src="'+a+'"></audio>';row.appendChild(box);chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;await sleep(5000);
  }
  await sleep(2000);t=typing();await sleep(6000);t.remove();
  bubble('<b><a href="pagamento.html" style="color:#00d4aa">👉 CLIQUE AQUI e garanta seu pack por R$ 19,90</a></b>');
  await sleep(2000);t=typing();await sleep(6000);t.remove();
  bubble('Aproveita que logo logo eu apago tudo, agora vou sair que meu marido chegou. Beijos, te espero lá!');
}
start();
</script>
</body>
</html>
